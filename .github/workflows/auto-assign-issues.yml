# Assign newly opened issues to the repo owner.
#
# A live issue watch on this repo only receives issue-assigned events, not
# issue-opened. Assigning on open is what makes that watch fire.
#
# This workflow runs on issues opened only. It does not run on pull_request.
# If the issue already has an assignee (opened with assignees set), skip.

name: Auto-assign issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign goktugvatandas
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (issue.assignees && issue.assignees.length > 0) {
              core.info(`Issue #${issue.number} already has an assignee; skipping.`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: ["goktugvatandas"],
            });
